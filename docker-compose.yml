services:
  vantage:
    image: mt5-headless
    container_name: mt5_vantage
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./vantage_data:/mt5
    environment:
      - WINEDEBUG=-all

  ftmo:
    image: mt5-headless
    container_name: mt5_ftmo
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./ftmo_data:/mt5
    environment:
      - WINEDEBUG=-all
